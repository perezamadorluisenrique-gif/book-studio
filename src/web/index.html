<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Studio: free KDP book formatter in your browser</title>
    <meta name="description" id="meta-description" content="Turn a folder of Markdown notes into a print-ready paperback PDF and an accessible EPUB 3. Everything runs in your browser." />
    <link rel="canonical" href="https://perezamadorluisenrique-gif.github.io/book-studio/" />
    <link rel="alternate" hreflang="en" href="https://perezamadorluisenrique-gif.github.io/book-studio/en/" />
    <link rel="alternate" hreflang="es" href="https://perezamadorluisenrique-gif.github.io/book-studio/es/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="studio.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">Book Studio</h1>
      <p class="app-tagline" data-i18n="web.tagline">Markdown notes in, a paperback PDF and an accessible EPUB out. Nothing leaves your browser.</p>
      <nav class="app-actions" id="nav-source" aria-label="Book source">
        <button type="button" id="open-projects" data-i18n="web.myBooks">My books</button>
        <button type="button" id="open-folder" data-i18n="web.openFolder">Open a folder</button>
        <button type="button" id="reopen-folder" hidden>Reopen</button>
        <button type="button" id="open-sample" data-i18n="web.sample">Sample book</button>
        <input type="file" id="folder-input" webkitdirectory multiple hidden />
      </nav>
      <nav class="app-guides" id="nav-guides" aria-label="Guides">
        <a href="en/" id="guides-en" data-i18n="web.guides">KDP guides</a>
        <a href="es/" lang="es" hreflang="es">Guías en español</a>
      </nav>
      <div class="app-lang">
        <select id="lang" aria-label="Language">
          <option value="en" lang="en">English</option>
          <option value="es" lang="es">Español</option>
        </select>
      </div>
    </header>
    <section id="projects" class="app-projects" aria-labelledby="proj-title" hidden></section>
    <div id="workspace" class="ws" hidden></div>
    <main id="studio" class="app-main"></main>
    <div id="toasts" class="app-toasts" role="status" aria-live="polite"></div>
    <dialog id="dialog" class="app-dialog" aria-labelledby="dialog-title">
      <form method="dialog">
        <h2 id="dialog-title"></h2>
        <div id="dialog-body"></div>
        <div class="app-dialog-buttons" id="dialog-buttons"></div>
      </form>
    </dialog>
    <noscript id="noscript">Book Studio needs JavaScript to typeset your book in the browser.</noscript>
  </body>
</html>
