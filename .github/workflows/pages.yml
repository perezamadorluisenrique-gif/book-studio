# Publishes the web app (the same studio, in the browser), the guide pages and
# the sample downloads to GitHub Pages on every push to main. Nothing deploys
# unless every sample PDF passes the KDP check (inside `npm run build:web`) and
# every sample EPUB passes EPUBCheck. Pages must be set to "GitHub Actions" once, under
# Settings -> Pages -> Build and deployment -> Source.
name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npm run epubcheck
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deployment
        uses: actions/deploy-pages@v4
