# Build and test on every push and pull request, so a broken commit is caught
# here rather than by the release job with a tag already cut.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned: ubuntu-latest moving to a new image breaks Playwright's system deps.
    runs-on: ubuntu-24.04
    # A normal run takes ~3 min. On 2026-11-06 one hung for ~54 min on a bad
    # runner (Playwright install 8 min, then e2e never ended) and mailed a failure.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 and no lower: the tests run `node --test` straight on .ts files,
          # and the type stripping that needs arrives in 22.18.
          node-version: '22'
          cache: npm

      - run: npm ci
      # The same rules Obsidian's plugin review runs.
      - run: npm run lint
      # The build script runs `tsc -noEmit` before bundling with esbuild.
      - run: npm run build
      - run: npm test
      # Browser tests over the built web app: export PDF and EPUB, KDP check, axe.
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run e2e
